default: &default
  provider: <%= ENV.fetch("AI_PROVIDER") { ENV["OPENAI_API_KEY"].present? ? "openai" : "deterministic" } %>
  model: <%= ENV.fetch("OPENAI_MODEL", "gpt-5.6-sol") %>
  embedding_model: <%= ENV.fetch("OPENAI_EMBEDDING_MODEL", "text-embedding-3-small") %>
  reasoning_effort: <%= ENV.fetch("AI_REASONING_EFFORT", "low") %>
  request_timeout: <%= ENV.fetch("AI_REQUEST_TIMEOUT", 60) %>

development:
  <<: *default

test:
  <<: *default
  provider: deterministic

production:
  <<: *default
