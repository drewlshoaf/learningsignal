          citation_validity: 1.0
          citation_completeness: 1.0
          groundedness: 1.0
          recommendation_relevance: 1.0
        maximum:
          unsupported_claim_rate: 0.0
          inappropriate_inference_rate: 0.0
          provider_error_rate: 0.0

