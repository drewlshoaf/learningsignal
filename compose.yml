name: learningsignal

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://learningsignal:learningsignal@postgres:5432/learningsignal_development
    TEST_DATABASE_URL: postgresql://learningsignal:learningsignal@postgres:5432/learningsignal_test
    QUEUE_DATABASE_URL: postgresql://learningsignal:learningsignal@postgres:5432/learningsignal_development_queue
    CABLE_DATABASE_URL: postgresql://learningsignal:learningsignal@postgres:5432/learningsignal_development_cable
    AI_PROVIDER: ${AI_PROVIDER:-deterministic}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    S3_ENDPOINT: http://minio:9000
    MAILER_HOST: mailpit
  volumes:
    - .:/rails
  depends_on:
    postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  web:
    <<: *app
    command: ./bin/rails server -b 0.0.0.0
    ports:
      - "3000:3000"

  worker:
    <<: *app
    command: ./bin/jobs start

  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_USER: learningsignal
      POSTGRES_PASSWORD: learningsignal
      POSTGRES_DB: learningsignal_development
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learningsignal -d learningsignal_development"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: learningsignal
      MINIO_ROOT_PASSWORD: learningsignal-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 learningsignal learningsignal-local-only &&
        mc mb --ignore-existing local/learningsignal-development

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  minio:
  postgres:
